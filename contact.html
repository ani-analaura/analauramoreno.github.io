<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ani — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2" />
<script>
  // Strip any URL fragment before the browser can act on it. Native
  // fragment-scroll on this site can land in the wrong place: every
  // page's content lives inside a `transform: scale()`'d .stage inside
  // a `.stage-frame` (overflow: hidden, for the height-compensation fix
  // — see styles.css) — and per spec, fragment navigation also scrolls
  // *any* scrollable ancestor, including overflow:hidden ones, not just
  // the window. That shifts .stage-frame's own internal scroll instead
  // of (or in addition to) the page, breaking the layout. Stashing the
  // hash and clearing the URL here — before body content even parses —
  // prevents that native jump; script.js reads window.__pendingHash and
  // scrolls the real window to the right place by hand instead.
  if (location.hash) {
    window.__pendingHash = location.hash;
    history.replaceState(null, '', location.pathname + location.search);
  }
</script>
</head>
<body class="page-dark">

  <!-- ============ Contact ============
       Literal port of the Figma "Contact" frame (nodeId 127:195): a
       "Let's chat" heading + intro copy on the left, a real contact
       form below it (First name / Last name / Email Address / Your
       message, each an underlined input using the label text as its
       placeholder — that's exactly how the design draws it, no
       separate floating label), and on the right a "General" contact
       block with the email/phone and two social icons. No footer on
       this frame (Figma doesn't have one here either). Same 1728-wide
       scale-to-fit stage as every other page. -->
  <div class="header-fixed is-on-dark">
    <div class="stage" id="headerStage" data-reflow>
      <header class="site-header">
        <a href="index.html" class="logo"><img src="images/header/ani-badge.png" alt="ani" class="logo-img"></a>
        <a href="#" class="menu-link" id="menuToggle" aria-haspopup="true" aria-expanded="false" aria-controls="menuOverlay"><img src="images/header/menu-badge.png" alt="Menu" class="menu-link-img"></a>
      </header>
    </div>
  </div>

  <div class="stage-frame">
  <div class="stage" id="contactStage" data-reflow>

    <!-- Heading -->
    <h1 class="contact-heading" data-reveal>Let&rsquo;s <em>chat</em></h1>

    <!-- Intro copy -->
    <div class="contact-intro">
      <p data-reveal>I can&rsquo;t always share every project publicly, but I&rsquo;d love to tell you more about my process, ideas, and the stories behind my work.</p>
      <p class="contact-intro-note" data-reveal>Fill out the form or send me an email.<br>All fields required</p>
    </div>

    <!-- Contact form — no backend, so Submit opens a pre-filled Gmail
         compose window with the field values (same trick as the
         footer email link elsewhere on the site; see script.js). -->
    <form class="contact-form" id="contactForm">
      <input class="form-field form-field-first" type="text" name="firstName" placeholder="First name" required>
      <input class="form-field form-field-last" type="text" name="lastName" placeholder="Last name" required>
      <input class="form-field form-field-email" type="email" name="email" placeholder="Email Address" required>
      <input class="form-field form-field-message" type="text" name="message" placeholder="Your message" required>

      <button type="submit" class="contact-submit">Submit</button>
    </form>

    <!-- Right column: contact details -->
    <div class="contact-side">
      <p class="contact-side-title" data-reveal>General</p>
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=analauralga21@gmail.com" class="contact-side-link contact-email" data-reveal target="_blank" rel="noopener">analauralga21@gmail.com</a>
      <a href="tel:+525560931342" class="contact-side-link contact-phone" data-reveal>+52 55 60 93 13 42</a>

      <!-- Icon glyphs are still placeholders (couldn't download the
           real Figma SVG assets in this environment), but the links
           now go to your real profiles. -->
      <div class="contact-socials">
        <a href="https://www.behance.net/analaura15" class="social-icon" aria-label="Behance" target="_blank" rel="noopener">Be</a>
        <a href="https://www.linkedin.com/in/ana-laura-moreno-lizarraga/" class="social-icon" aria-label="LinkedIn" target="_blank" rel="noopener">in</a>
      </div>
    </div>
  </div>
  </div>

  <!-- ============ Menu — half-screen slide-in overlay ============
       Same reusable component as on every other page — see index.html
       for the full explanation. -->
  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-backdrop-fill" id="menuBackdrop"></div>
    <div class="menu-reveal" id="menuReveal">
      <div class="menu-panel-fill"></div>
      <div class="stage menu-stage" data-reflow>
        <button type="button" class="menu-close" id="menuClose" aria-label="Cerrar menú">
          <svg viewBox="0 0 31 29" width="31" height="29" fill="none" aria-hidden="true">
            <line x1="2" y1="2" x2="29" y2="27" stroke="#f0e7d4" stroke-width="3.4" stroke-linecap="round"/>
            <line x1="29" y1="2" x2="2" y2="27" stroke="#f0e7d4" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
        </button>

        <nav class="menu-nav" aria-label="Menú principal">
          <a href="gallery.html" class="menu-nav-item menu-nav-work">Work</a>
          <a href="about.html" class="menu-nav-item menu-nav-about">About</a>
          <a href="proyects.html#servicesTop" class="menu-nav-item menu-nav-services">Services</a>
          <a href="contact.html" class="menu-nav-item menu-nav-contact">Contact</a>
        </nav>
      </div>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
